<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My App</title>
</head>
<body>
    <h1>Welcome to My App</h1>
    <p>This is a simple Django template.</p>
    
    {% for item in item_list %}
    <a href="{% url'detail' item.itemid %}">
        <p>{{ item }} --> {{item.item_quantity}} --> {{item.item_price}} --> {{item.item_desc}}</p>
    </a>
    {% endfor %}
    
</body>
</html>
